[project]
name = "3dgall"
version = "0.1.0"
description = "FastAPI backend for a WebXR depth gallery."
requires-python = ">=3.11"
dependencies = [
  "fastapi[standard]>=0.115.0",
  "numpy>=1.26.0",
  "pillow>=10.4.0",
  "pydantic>=2.8.0",
  "trimesh>=4.4.0",
]

[project.optional-dependencies]
da3 = [
  "torch>=2.3.0",
  "torchvision>=0.18.0",
  "transformers>=4.44.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

